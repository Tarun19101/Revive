{% extends "base_authenticated.html" %}
{% block title %}Edit Event{% endblock %}
{% block page_content %}

<h2 class="text-2xl font-bold mb-6">Edit Event</h2>

<div class="bg-gray-950 border border-gray-800 rounded-xl p-6 max-w-xl">
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {% for field in form %}
            <div>
                <label class="block text-sm text-gray-400 mb-1">{{ field.label }}</label>
                {{ field }}
            </div>
        {% endfor %}
        <button type="submit" class="px-5 py-2 bg-white text-black rounded-lg hover:bg-gray-200 transition font-medium">
            Save
        </button>
        <a href="{% url 'event_list' %}" class="ml-3 text-sm text-gray-400 underline hover:text-white">Cancel</a>
    </form>
</div>

{% endblock %}
