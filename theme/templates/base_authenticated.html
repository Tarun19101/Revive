{% extends "base.html" %}
{% block content %}
<div class="min-h-screen bg-black text-white flex">

    <!-- Sidebar -->
    <aside class="w-64 bg-gray-950 border-r border-gray-800 flex flex-col">
        <div class="px-6 py-5 border-b border-gray-800">
            <h1 class="text-xl font-bold tracking-wide">REVIVE</h1>
        </div>

        <nav class="flex-1 px-3 py-4 space-y-1">
            <a href="{% url 'dashboard' %}" class="block px-3 py-2 rounded-lg hover:bg-gray-800 transition">Dashboard</a>
            <a href="{% url 'profile' %}" class="block px-3 py-2 rounded-lg hover:bg-gray-800 transition">Profile</a>
            <a href="{% url 'progress' %}" class="block px-3 py-2 rounded-lg hover:bg-gray-800 transition">Progress</a>
            <a href="{% url 'task_list' %}" class="block px-3 py-2 rounded-lg hover:bg-gray-800 transition">Tasks</a>
            <a href="{% url 'habit_list' %}" class="block px-3 py-2 rounded-lg hover:bg-gray-800 transition">Habits</a>
            <a href="{% url 'quest_list' %}" class="block px-3 py-2 rounded-lg hover:bg-gray-800 transition">Quests</a>
            <a href="{% url 'deepwork_home' %}" class="block px-3 py-2 rounded-lg hover:bg-gray-800 transition">Deep Work</a>
            <a href="{% url 'bank_home' %}" class="block px-3 py-2 rounded-lg hover:bg-gray-800 transition">Bank</a>
            <a href="{% url 'event_list' %}" class="block px-3 py-2 rounded-lg hover:bg-gray-800 transition">Events</a>
        </nav>

        <div class="px-3 py-4 border-t border-gray-800">
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="w-full text-left px-3 py-2 rounded-lg hover:bg-gray-800 transition text-gray-400">
                    Logout
                </button>
            </form>
        </div>
    </aside>

    <!-- Main content -->
    <main class="flex-1 p-8 overflow-y-auto">
        {% block page_content %}
        {% endblock %}
    </main>

</div>
{% endblock %}
