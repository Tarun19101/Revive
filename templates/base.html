{% load tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Revive{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    {% tailwind_css %}
</head>
<body class="bg-bg text-text font-body bg-dot-grid">
        
    {% block content %}
    {% endblock %}

    {% if debug %}
        {% load django_browser_reload %}
        {% django_browser_reload_script %}
    {% endif %}
</body>
</html>
